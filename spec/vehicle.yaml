# Talon vehicle spec: single source of truth (CLAUDE.md rule 3). SI units (ADR 0001).
schema: 2
vehicle:
  name: talon-1
  mission:
    payload_kg: 400.0              # to 500 km circular LEO
    dv_to_orbit_mps: 9300.0        # ideal dv incl. gravity/drag/steering losses budget
    booster_recovery_dv_mps: 1600.0  # boostback-lite + entry + landing burn (downrange barge)
    booster_dv_min_mps: 2800.0     # staging floor: below this a T/W<1 upper stage pays large gravity
                                   # losses that the fixed loss budget does not model (refined in M2)
    liftoff_tw: 1.35
    upper_stage_initial_tw: 0.75
  diameter_m: 1.8
  propellants:                     # LOX / liquid methane
    mixture_ratio: 3.5             # O/F by mass
    rho_ox: 1141.0
    rho_fuel: 422.6
    ullage_fraction: 0.05
  engines:
    booster:                       # gas-generator methalox, gimbaled centre + fixed outer
      count: 5
      thrust_sl_n: 70000.0         # uprated from 60 kN after the detailed CAD raised booster dry mass
      isp_sl_s: 298.0
      isp_vac_s: 327.0
      mass_kg: 105.0
      throttle_min: 0.45
      gimbal_max_deg: 6.0          # centre engine only; outer four fixed
      length_m: 1.10
      exit_diameter_m: 0.36
    upper:
      count: 1
      thrust_vac_n: 80000.0
      isp_vac_s: 352.0
      mass_kg: 150.0
      throttle_min: 0.40
      length_m: 1.40
      exit_diameter_m: 0.80
  material:                        # Al-Li 2195 tank barrels and domes
    name: AlLi-2195
    rho: 2710.0
    E: 76.0e+9
    nu: 0.33
    yield_pa: 590.0e+6
    ultimate_pa: 625.0e+6
  structures:
    tank_pressure_pa: 3.0e+5        # ullage MEOP, both tanks
    min_gauge_m: 1.2e-3
    gauge_step_m: 1.0e-4           # walls rounded up to stock gauge
    factor_of_safety: 1.4          # ultimate, applied to limit loads
    design_max_q_pa: 38000.0       # verified against the trajectory in M2
    design_alpha_maxq_deg: 4.0
    max_axial_g: 6.0               # booster burnout with throttle-down limit
    maxq_axial_g: 2.5              # axial load factor at max-q
    cn_alpha_per_rad: 2.5          # whole-vehicle normal-force slope (refined by aero/ in M2)
  aero:                            # ascent configuration, reference area = body cross-section
    mach:    [0.0, 0.6, 0.8, 0.9, 1.0, 1.1, 1.2, 1.5, 2.0, 3.0, 4.0, 6.0, 10.0]
    ca_on:   [0.30, 0.30, 0.32, 0.40, 0.55, 0.65, 0.62, 0.55, 0.45, 0.35, 0.30, 0.25, 0.22]
    ca_base_off: 0.12              # extra base drag with engines off (coast)
    cn_alpha_nose_per_rad: 2.0     # slender-body theory, any pointed nose
  ascent:
    launch_site: {lat_deg: 28.5, lon_deg: -80.6, alt_m: 0.0}
    azimuth_deg: 90.0
    target_apogee_km: 500.0
    min_perigee_km: 180.0          # insertion orbit floor; circularised at apogee
    vertical_rise_s: 8.0
    kick_duration_s: 6.0
    maxq_throttle: 0.75            # booster throttle setting through the max-q bucket
    maxq_bucket_frac: 0.85         # throttle down when q exceeds this fraction of design max-q
    staging_coast_s: 4.0
    fairing_jettison_q_pa: 5.0     # dynamic pressure below which the fairing is dropped
    dt_s: 0.1
  layout:                          # CAD layout (cad/vehicle.py), z = 0 at the booster skirt base
    dome_aspect: 0.7071            # dome height / radius (sqrt(2) dome)
    booster_skirt_m: 1.80          # engine bay height below the fuel barrel
    bay_gap_m: 0.15                # clearance between facing domes in an intertank
    min_barrel_m: 0.10             # shortest tank barrel (a tank never collapses to two domes)
    interstage_extra_m: 0.50       # interstage length beyond upper nozzle + dome (gimbal clearance)
    upper_fwd_skirt_extra_m: 0.20
    payload_adapter_m: 0.50
    frame: {height_m: 0.030, depth_m: 0.040}          # internal ring frames in dry bays
    engine_bay:
      nozzle_below_skirt_m: 0.30   # nozzle exits protrude below the skirt base
      ring_radius_frac: 0.62       # outer-engine ring radius / body radius
      gimbal_block: {radius_m: 0.07, height_m: 0.10}
      thrust_plate: {radius_m: 0.75, thickness_m: 0.012, lightening_hole_r_m: 0.11}
      thrust_cone_top_m: 1.30      # thrust cone meets the skirt wall at this z
      thrust_cone_t_m: 0.004
      heat_shield: {thickness_m: 0.012, rho: 1600.0, clearance_m: 0.02}
    upper_engine: {gimbal_max_deg: 5.0, mount_drop_m: 0.15, mount_t_m: 0.004}
    downcomer: {radius_m: 0.075, wall_m: 0.003}
    raceway: {azimuth_deg: 22.0, width_m: 0.12, height_m: 0.05, wall_m: 0.003, rho: 1600.0}
    rcs: {count: 4, azimuth0_deg: 45.0, width_m: 0.16, height_m: 0.15, depth_m: 0.07}
    payload: {bus_m: [0.80, 0.80, 0.90], panel_t_m: 0.03, dish_d_m: 0.50}
    fairing: {cyl_m: 2.20, nose_m: 2.60, thickness_m: 0.004, rho: 1600.0, nose_radius_m: 0.08}
    nose_cp_fraction: 0.6667       # CP of the nose, fraction of nose length from tip (conservative)
    grid_fins: {count: 4, span_m: 0.60, width_m: 0.50, depth_m: 0.08, web_m: 0.006, cells: [6, 5],
                rho: 4430.0, hinge_offset_m: 0.14, hinge_below_sep_m: 0.62, deploy_deg: 90.0,
                housing: {height_m: 0.24, depth_m: 0.08, width_m: 0.36}}
    legs: {count: 4, azimuth0_deg: 45.0, length_m: 2.80, hinge_z_m: 0.25, hinge_offset_m: 0.14,
           main_d_m: 0.16, main_t_m: 0.006, side_d_m: 0.08, side_t_m: 0.003, side_spread_m: 0.28,
           rho: 1600.0, pad_d_m: 0.36, pad_h_m: 0.05, pad_rho: 700.0, deploy_deg: 120.0,   # pad: Al honeycomb crush core
           bracket: {height_m: 0.40, depth_m: 0.05, width_m: 0.70}}
  lumped:                          # non-CAD masses per stage (kg), spread at the stage CoM
    booster: {avionics: 45.0, leg_actuators_dampers: 72.0}
    booster_misc_fraction: 0.06    # wiring, pressurant, small plumbing as fraction of CAD structure
    upper: {avionics: 35.0}
    upper_misc_fraction: 0.08
  sizing:
    struct_fraction_guess: {booster: 0.08, upper: 0.10}
    closure_tol: 0.005             # relative change in dry mass between iterations
